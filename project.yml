name: Codenotch
options:
  bundleIdPrefix: com.zenon7171
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Bundle versions remain aligned with the upstream base release.
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "7"
    # Local Japanese builds use ad-hoc signing; no upstream identity is used.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Reading credentials and editor databases requires an unsandboxed app.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Codenotch
        CFBundleDisplayName: Codenotch 日本語版
        LSMinimumSystemVersion: "26.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenon7171.codenotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenon7171.codenotch.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
